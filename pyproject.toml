[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wysgnn"
version = "0.1.0"
description = "Wyckoff-position-aware space group neural network for crystal tensor properties"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "torch_geometric>=2.5",
    "e3nn>=0.5",
    "pymatgen>=2024.1",
    "spglib>=2.1",
    "ase>=3.22",
    "numpy",
    "scipy",
    "pyyaml",
]

[project.optional-dependencies]
jarvis = ["jarvis-tools"]
dev = ["pytest"]

[tool.setuptools]
packages = ["wysgnn", "wysgnn.symmetry", "wysgnn.data", "wysgnn.nn"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
