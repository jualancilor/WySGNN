# WySGNN reproducibility config. Seeds everything; logged into result files.
seed: 0

data:
  source: synthetic          # "synthetic" (teacher/student pilot) or "jarvis"
  n_structures: 100
  cutoff: 5.0
  lmax: 2
  mul: 4
  symprec: 1.0e-3
  splits_path: results/splits.json

model:
  lmax: 2
  mul: 4
  num_layers: 2
  cutoff: 5.0
  sh_lmax: 2
  out_sh_lmax: 3
  num_basis: 8
  radial_hidden: 64
  avg_num_neighbors: 12.0

baseline:
  hidden: 64
  num_layers: 3
  num_basis: 8

train:
  epochs: 70
  lr: 5.0e-3
  weight_decay: 1.0e-4
  batch_size: 16
  ema_decay: 0.999
  patience: 20
  min_epochs: 15

eval:
  violation_rel_thresh: 0.01
  sample_fractions: [0.05, 0.10, 0.25, 0.50, 1.00]
